repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: end-of-file-fixer
        # Whitespace in Mustache templates is significant.
        exclude: \.mustache$
      - id: trailing-whitespace
        exclude: \.mustache$
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: zig-fmt
        name: zig fmt
        entry: zig fmt
        language: system
        files: \.(zig|zon)$
